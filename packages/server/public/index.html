<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>蜂巢看板 · Hive Mission Control</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header>
    <h1>🐝 蜂巢看板</h1>
    <span id="conn" class="dim">连接中…</span>
    <span id="team" class="dim"></span>
  </header>

  <section class="composer">
    <form id="new-task">
      <input name="title" placeholder="任务标题，如：竞品简报" required />
      <input name="brief" placeholder="一句话需求（发一句话，团队自动跑）" required />
      <input name="budget" type="number" min="0.1" step="0.1" value="3" title="预算 $" />
      <button type="submit">发单 →</button>
    </form>
  </section>

  <main>
    <aside id="tasks" aria-label="任务列表"></aside>

    <section id="panel">
      <div id="status-line" class="dim">← 在左侧选一个任务，或直接发一单</div>

      <h2>时间线</h2>
      <div id="timeline" class="dim">—</div>

      <h2>输出流</h2>
      <pre id="outputs" class="dim">（bot 输出实时滚动）</pre>

      <h2>账单</h2>
      <div id="receipt" class="dim">—</div>

      <h2>产物</h2>
      <div id="artifacts" class="dim">—</div>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
